services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${PGUSER:-hidesk}
      POSTGRES_PASSWORD: ${PGPASSWORD:-hidesk}
      POSTGRES_DB: ${PGDATABASE:-hidesk}
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${PGUSER:-hidesk}']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - '6379:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: ./backend
    environment:
      PORT: 4000
      NODE_ENV: production
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:5173}
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production-hidesk-secret}
      DATABASE_URL: postgres://${PGUSER:-hidesk}:${PGPASSWORD:-hidesk}@postgres:5432/${PGDATABASE:-hidesk}
      REDIS_URL: redis://redis:6379
      RUN_MIGRATIONS: 'true'
      # Auto-load the 30-organization operating dataset on first boot.
      # Idempotent: skips if the DB is already populated (restarts won't wipe data).
      # Set RUN_DEMO_SEED=false + RUN_SEED=true for the small starter dataset instead.
      RUN_DEMO_SEED: ${RUN_DEMO_SEED:-true}
      RUN_SEED: ${RUN_SEED:-false}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - '4000:4000'
    volumes:
      - uploads:/app/uploads

  frontend:
    build: ./frontend
    depends_on:
      - backend
    ports:
      - '5173:5173'

volumes:
  pgdata:
  uploads:
